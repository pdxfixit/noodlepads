# Daily: is https://noodlepads.com up (/, /version.json, /api/cloud), and does it
# serve main's web/ and worker/? A down or broken site fails (after 3
# retries, 20 s apart); live behind main passes with a notice for the first hour
# after main changed those paths (a deploy in flight), then fails.
# tools/live_check.py. Read-only GETs, no secrets; GitHub never deploys.
name: live
on:
  schedule:
    - cron: '29 15 * * *'  # daily, 08:29 Pacific (daylight time)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the live commit and when main last changed web/, worker/
      - name: Live site against main
        run: python3 tools/live_check.py
