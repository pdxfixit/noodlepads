# Daily: is https://noodlepads.com up and working? /, /version.json and
# /api/cloud must answer (and /api/cloud say ok), and /api/profiles must list
# (it reads the D1 database, which /api/cloud does not); a miss fails after 3 retries,
# 20 s apart. Which commit is live is not checked: deploy.yml deploys every push
# to main, and a failed deploy is a red run there.
# tools/live_check.py. Read-only GETs, no secrets; this workflow never deploys.
name: live
on:
  schedule:
    - cron: '29 15 * * *'  # daily, 08:29 Pacific (daylight time)
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Live site is up
        run: python3 tools/live_check.py
      - name: Report
        if: always()
        continue-on-error: true
        uses: pdxfixit/flarepress/ci@v1
        with:
          status: ${{ job.status }}
          endpoint: ${{ vars.CI_ENDPOINT }}
          key: ${{ secrets.CI_EVENTS_KEY }}
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
