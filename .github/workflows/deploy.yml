# Every push to main is deployed to https://noodlepads.com (Ben, 2026-10-15):
# the tests and the release checks, then the flarepress action (check, gate,
# stamp, wrangler deploy, verify), then the live checks. Before the upload it
# applies any migration D1 lacks (Ben, 2026-10-26), so a new Worker never meets
# an older database. GitHub holds this repo's own Cloudflare token (Workers,
# its zone, D1 edit); no agent holds one, and only the migrate and upload steps
# see it. Ben's `just deploy` on the Mac is the fallback.
#
# Secrets: CLOUDFLARE_API_TOKEN, D1_DATABASE_ID (site/wrangler.toml names it
# as ${D1_DATABASE_ID}), CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time: a newer push waits rather than cancels the running
# one. Of several waiting, GitHub keeps only the newest (it cancels the
# others), which deploys main with their commits in it.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      FLAREPRESS: ${{ github.workspace }}/.flarepress
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, as the test run has (the label itself is v<release>-<commit>)
      # The same flarepress the action is, for the recipes (cloud-db).
      - uses: actions/checkout@v7
        with:
          repository: pdxfixit/flarepress
          ref: v1  # the same tag as the action below
          path: .flarepress
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
      - name: Install just (pinned release)
        run: curl -sSfL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin just
      - name: just test
        env:
          NOODLE_NAME_HASHES: ${{ secrets.NOODLE_NAME_HASHES }}   # the kids' names' hashes, kept out of the repo
        run: just test
      # The release checks test.yml runs too, here as well: test.yml runs beside
      # this workflow, so without them a web/ change pushed without `just version`
      # went live under the old release before test.yml went red.
      - name: web/version.js bumped after the last change to web/
        run: tools/version_bumped.sh
      - name: web/version.js PATCH is the commit count of its commit
        run: python3 tools/bump_version.py --check
      # The same tool as Ben's `just cloud-migrate --yes`. Up to date, it only
      # reads. A migration that drops a table D1 holds rows of stops here: CI
      # has no telemetry mirror to prove they were copied, so drops stay Ben's.
      - name: Apply the migrations D1 lacks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: just cloud-migrate --yes
      - uses: pdxfixit/flarepress@v1  # rolling: the owner moves v1 to release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          site: site
      - name: Live checks (cloud-smoke, cloud-e2e, taps)
        env:
          CHROME: /usr/bin/google-chrome
        run: just deploy-checks
