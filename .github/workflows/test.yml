# Tests on every push and pull request: just test (syntax, the Node tests, the
# tools' and the noodlepads-logs skill's unittest), then the release checks
# (web/version.js bumped with web/, PATCH the commit count). This workflow never
# deploys; deploy.yml does, on pushes to main. No secrets. Node and just are
# pinned to the versions on Ben's Mac (tests/fake-d1.mjs needs node:sqlite).
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release checks count commits
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
      - name: Install just (pinned release; Ubuntu's is too old for [doc] and [positional-arguments])
        run: curl -sSfL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin just && just --version
      - name: just test
        env:
          NOODLE_NAME_HASHES: ${{ secrets.NOODLE_NAME_HASHES }}   # the kids' names' hashes, kept out of the repo
        run: just test
      - name: web/version.js bumped after the last change to web/
        run: tools/version_bumped.sh
      - name: web/version.js PATCH is the commit count of its commit
        run: python3 tools/bump_version.py --check
      # Last, so a red run never hides the release checks above.
      - name: just taps (a finger on a phone in headless Chrome; every tap must sound)
        env:
          CHROME: /usr/bin/google-chrome
        # One retry, said out loud: headless audio on a shared runner can stall. A real fault fails both.
        run: just taps || { echo "↻ just taps failed once; trying again"; just taps; }
