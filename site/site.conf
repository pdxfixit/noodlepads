# Read by tools/site.sh (key=value, never run as shell). See flarepress AGENTS.md, App sites.
url=https://noodlepads.com
committed=web worker site
pwa=0
compare=
version_wait=90
# version.json says v<release>-<short commit>, the release from web/version.js (just version).
release=web/version.js
# A revert, never an old checkout: the Worker must match the live D1 tables.
rollback=revert
