# Read by tools/harvest.py (key=value, never run as shell). See flarepress AGENTS.md, Telemetry harvest.
# No db=: the telemetry runner (the only harvester) passes --db, and the Mac reads its mirror
# (`telemetry.py pull`). The older Mac archive, metrics.sqlite3, is retired (docs/how-to.md).
keychain=noodlepads-logs
table=activity append id
table=devices upsert hash min=first_seen
# Profiles hold fun names, avatars, PIN hashes and salts: only the id and when it was
# made leave D1 (the shared privacy policy, 2026-10-16: no names leave).
table=profiles upsert id cols=id,created as=players
