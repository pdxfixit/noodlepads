# Read by tools/harvest.py (key=value, never run as shell). See flarepress AGENTS.md, Telemetry harvest.
# Noodle Pads' existing archive, so its history and the app repo's report code carry over.
db=~/.local/state/noodlepads/metrics.sqlite3
keychain=noodlepads-logs
table=activity append id
# New in a coming Noodle Pads migration: skipped until D1 has it.
table=visits append id
table=devices upsert hash min=first_seen
table=uses upsert profile_id,feature,day max=n
# Profiles hold PIN hashes and salts: only these columns leave D1.
table=profiles upsert id cols=id,name,avatar,created as=players
