# Noodle Pads on Cloudflare: one Worker serving web/ as static files and
# worker/ for /api (cloud profiles, problem reports, player metrics, usage events,
# feedback).
# Deployed by flarepress (github.com/pdxfixit/flarepress): on every push to
# main by .github/workflows/deploy.yml, or by Ben's `just deploy`.
# Apex only: a www copy would be a second origin with its own saved sounds.
# One D1 database, an R2 bucket for usage events, the shared feedback bucket,
# rate limits (feedback's, and the cloud's per profile), nothing else (keep
# the free-plan footprint small).
# This repo is public: the database id is ${D1_DATABASE_ID}, filled at deploy
# time from a GitHub secret or ~/.config/noodlepads/cloud.json.
name = "noodlepads-com"
compatibility_date = "2026-10-11"
main = "../worker/index.js"

routes = [
  { pattern = "noodlepads.com", custom_domain = true }
]

[assets]
directory = "../web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "noodle-pads"
database_id = "${D1_DATABASE_ID}"

# Usage events (POST /api/events, worker/events-worker.js from flarepress):
# each batch stored as sent; the telemetry runner's job reads and deletes them.
[[r2_buckets]]
binding = "EVENTS"
bucket_name = "noodlepads-telemetry"

# Feedback (POST /api/feedback, handleFeedback in worker/events-worker.js):
# what a grown-up typed in Settings → About → Feedback, stored as sent under
# v1/noodlepads/. One bucket holds every app's feedback, a prefix each; the
# telemetry runner's daily pull copies each message to Ben's notes and
# deletes it (none is kept over 90 days).
[[r2_buckets]]
binding = "FEEDBACK"
bucket_name = "app-suggestions"

# A flood guard for /api/feedback: 10 messages a minute for the whole app,
# counted under the app's name, never the sender's address.
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "4151"
simple = { limit = 10, period = 60 }

# Per-profile rate limits on the cloud routes that spend a shared daily cap
# (worker/cloud.js LIMITERS): each counted by the profile id, once its key is
# checked (an open: the profile opened), never by an address. Far above what a
# family meets, a big restore included (docs/architecture/cloud.md).
# Their namespace ids are this app's own block, 41510-41519 (each flarepress
# app's feedback limiter is 415N: Isopix 4150, this app 4151; its other
# limiters 415N0-415N9), so none meets another app's on the account
# (docs/deploy-cloudflare.md).
# A push: 60 a minute a profile (the app pushes 20 s after a change; a restore of
# a full profile is a few dozen pushes, and resumes where it stopped).
[[ratelimits]]
name = "PUSH_LIMITER"
namespace_id = "41511"
simple = { limit = 60, period = 60 }

# A sound's start or one of its pieces: 600 a minute a profile (a restore asks
# once per sound, one at a time, then sends the pieces it needs, and starts
# again from the first when it is cut off).
[[ratelimits]]
name = "SOUND_LIMITER"
namespace_id = "41512"
simple = { limit = 600, period = 60 }

# A share: 10 a minute a profile (a kid shares one thing at a time).
[[ratelimits]]
name = "SHARE_LIMITER"
namespace_id = "41513"
simple = { limit = 10, period = 60 }

# An open: 10 a minute a profile (once per device, and again after a new PIN).
[[ratelimits]]
name = "OPEN_LIMITER"
namespace_id = "41514"
simple = { limit = 10, period = 60 }

# An open, all profiles together: 60 a minute for one address (keyed by its
# daily hash, never the address), so one client can't try the 5 PINs of every
# listed profile, and can't shut everyone else out. A family opens a
# few times a day; over it is 429 slow, "busy right now" in the app.
[[ratelimits]]
name = "OPEN_SITE_LIMITER"
namespace_id = "41517"
simple = { limit = 60, period = 60 }

# A pull: 600 a minute a profile (a page is 500 records; a restore of a full
# profile is a few dozen pages, one after another), so one key can't spend
# D1's daily reads for every family.
[[ratelimits]]
name = "PULL_LIMITER"
namespace_id = "41515"
simple = { limit = 600, period = 60 }

# A sound's download: 1,200 a minute for the profile that owns it (no key: a
# share's sounds count on their sharer). A restore fetches its sounds one at
# a time, each at least two D1 reads in turn and the trip to the phone, so a
# device stays well under 20 a second; one that meets it is told to wait a
# minute (429 slow), and its sync tries again by itself.
[[ratelimits]]
name = "DOWNLOAD_LIMITER"
namespace_id = "41516"
simple = { limit = 1200, period = 60 }
