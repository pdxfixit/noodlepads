# just land (flarepress tools/land.sh): what a landing on main runs here.
# resolve: first match wins, so docs/adr/README.md is a list, not prose.
# after_pick: a release's PATCH is its commit count, which a landing on a newer main moves.
# version_bumped.sh: a change to web/ must carry its `just version` (as in Isopix).
test=just test-quiet && tools/version_bumped.sh
resolve=TODO.md:todo docs/adr/README.md:todo docs/questions.md:questions docs/*.md:words AGENTS.md:words README.md:words
after_pick=python3 tools/bump_version.py --restamp
after=just live
