# just land (flarepress tools/land.sh): what a landing on main runs here.
# resolve: first match wins, so docs/adr/README.md is a list, not prose.
test=just test-quiet
resolve=TODO.md:todo docs/adr/README.md:todo docs/questions.md:questions docs/*.md:words AGENTS.md:words README.md:words
after=just live
